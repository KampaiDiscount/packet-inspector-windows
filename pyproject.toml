[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-inspector-windows"
version = "0.1.4+win.1"
description = "Loss-visible, stream-aware sensitive-information traffic auditor"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Packet Audit contributors" }]
dependencies = ["pcapy-ng==1.1.0; platform_system != 'Windows'"]

[project.urls]
Homepage = "https://github.com/KampaiDiscount/packet-inspector-windows"
Documentation = "https://github.com/KampaiDiscount/packet-inspector-windows/blob/main/WINDOWS.md"
Repository = "https://github.com/KampaiDiscount/packet-inspector-windows"
Issues = "https://github.com/KampaiDiscount/packet-inspector-windows/issues"
Releases = "https://github.com/KampaiDiscount/packet-inspector-windows/releases"
Changelog = "https://github.com/KampaiDiscount/packet-inspector-windows/blob/main/RELEASE.md"

[project.scripts]
packet-audit = "packet_audit.cli:main"
packet-inspector = "packet_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packet_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
