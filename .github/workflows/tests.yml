name: Windows regression gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # Native driver/live-adapter checks are a separate local acceptance gate.
      # Hosted CI does not install Npcap or open a live capture interface.
      - run: python -m pip install . pytest==8.4.2
      - run: python -m pytest -o addopts= -q -rs
      - run: python -m compileall -q packet_audit tools
      - name: Parse Windows PowerShell launcher
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'windows\Packet-Inspector.ps1'),
            [ref]$tokens, [ref]$parseErrors) > $null
          if ($parseErrors.Count) { $parseErrors; exit 1 }
